name: Release

# Push a tag like v0.2.0 and the small download for non-technical users is attached to a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Build the zip
        run: node tools/package.mjs --out dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/claude-stick.zip dist/claude-stick.zip.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes "Download claude-stick.zip, unpack it onto a stick or folder and follow ANLEITUNG.txt. Checksum: claude-stick.zip.sha256."
